<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" media="all">
    <link rel="stylesheet" href="media-query_oresto.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Formulario</title>
</head>
<body>
    <main>
        <h1>Login</h1>
        <p>Seja bem vindo novamente. Faça login para acessar sua conta e poder fazer as cofiguraçoes no seu ambiente</p>
        <form action="" method="post" autocomplete="on">
            <label for="inome"> 
                <span class="material-symbols-outlined">person</span>
            </label>
            <input type="text" name="nome" id="idnome" required> <br>
            <label for="isenha">
                <span class="material-symbols-outlined">key</span>
            </label>
            <input type="password" name="senha" id="isenha" required placeholder="sua senha"> <br>
            <input type="submit" value="Entrar"> <br>   
            <input type="reset"value="Esqueci minha senha">
        </form>
    </main>
</body>
</html>
